<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google Snake</title>
<style>
  body{margin:0;font-family:sans-serif;background:#a2d149;}
  #header{
    background:#4a752c;color:white;
    display:flex;align-items:center;padding:10px;
    font-size:18px;height:50px;
  }
  #score,#highScore{display:flex;align-items:center;margin-right:20px;}
  #score img,#highScore img{margin-left:5px;}
  #controls{margin-left:auto;display:flex;gap:15px;}
  button{background:#578a34;color:white;border:none;padding:8px 12px;
          border-radius:4px;font-size:14px;cursor:pointer;}
  button:hover{opacity:.9;}
  canvas{
    display:block;margin:auto;background:#aad751;
    border:5px solid #578a34;
  }
  #overlay{
    position:absolute;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.7);color:white;font-size:36px;
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;visibility:hidden;
  }
  #overlay button{margin-top:20px;background:#4674e7;}
</style>
</head>
<body>
<div id="header">
  <div id="score"><span>Score:</span><span id="scoreVal">0</span></div>
  <div id="highScore"><span>High:</span><span id="highScoreVal"></span></div>
  <div id="controls">
    <button id="muteBtn">🔇</button>
    <button id="restartBtn">Restart</button>
  </div>
</div>

<canvas id="gameCanvas" width="480" height="480"></canvas>

<div id="overlay"><span id="finalScore"></span><br/><button id="playAgainBtn">Play Again</button></div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('scoreVal');
  const highScoreEl = document.getElementById('highScoreVal');
  const overlay = document.getElementById('overlay');
  const finalScoreEl = document.getElementById('finalScore');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const muteBtn = document.getElementById('muteBtn');

  const TILE_SIZE = 32;
  const GRID_W = 15, GRID_H = 15;
  const CANVAS_W = TILE_SIZE * GRID_W, CANVAS_H = TILE_SIZE * GRID_H;

  let snake = [{x:7,y:7}];
  let dir = {x:0,y:-1};
  let nextDir = null;
  let apple = null;
  let score = 0;
  let highScore = parseInt(localStorage.getItem('googleSnakeHigh')||'0',10);
  highScoreEl.textContent = highScore;

  // Audio
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const gainNode = audioCtx.createGain();gainNode.connect(audioCtx.destination);
  let muted = false;
  muteBtn.onclick = () => {muted=!muted;gainNode.gain.value=muted?0:1;muteBtn.textContent=muted?'🔈':'🔇';};

  function playEat(){
    if(muted)return;
    const osc = audioCtx.createOscillator();osc.type='sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.connect(gainNode);osc.start();
    setTimeout(()=>{osc.stop();},150);
  }
  function playOver(){
    if(muted)return;
    const osc = audioCtx.createOscillator();osc.type='sawtooth';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.connect(gainNode);osc.start();
    setTimeout(()=>{osc.stop();},800);
  }

  function spawnApple(){
    let pos;
    do{
      pos = {x:Math.floor(Math.random()*GRID_W),y:Math.floor(Math.random()*GRID_H)};
    }while(snake.some(p=>p.x===pos.x&&p.y===pos.y));
    apple=pos;
  }

  function drawCheckerboard(){
    for(let i=0;i<GRID_W;i++){
      for(let j=0;j<GRID_H;j++){
        ctx.fillStyle = (i+j)%2? '#aad751':'#a2d149';
        ctx.fillRect(i*TILE_SIZE,j*TILE_SIZE,TILE_SIZE,TILE_SIZE);
      }
    }
  }

  function drawSnake(){
    snake.forEach((p,idx)=>{
      const isHead=idx===0;
      ctx.beginPath();
      ctx.moveTo(p.x*TILE_SIZE+TILE_SIZE/2,p.y*TILE_SIZE+TILE_SIZE/2);
      // Rounded rectangle
      const r=TILE_SIZE*0.4;
      ctx.arc(p.x*TILE_SIZE+r,p.y*TILE_SIZE+r,r,Math.PI,1.5*Math.PI);
      ctx.arc((p.x+1)*TILE_SIZE-r,(p.y+1)*TILE_SIZE-r,r,1.5*Math.PI,2*Math.PI);
      ctx.arc((p.x+1)*TILE_SIZE-r,p.y*TILE_SIZE+r,r,0,0.5*Math.PI);
      ctx.arc(p.x*TILE_SIZE+r,(p.y+1)*TILE_SIZE-r,r,0.5*Math.PI,Math.PI);
      ctx.closePath();
      ctx.fillStyle = '#4674e7';
      ctx.fill();

      if(isHead){
        // Eyes
        const eyeOffset=dir.x===0? (dir.y>0?-10:10) : (dir.x>0?-10:10);
        const eyeY=dir.y===0? (dir.x>0?-10:10) : 0;
        ctx.fillStyle='white';
        ctx.beginPath();
        ctx.arc(p.x*TILE_SIZE+TILE_SIZE/2-5, p.y*TILE_SIZE+TILE_SIZE/2+eyeOffset,3,0,Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x*TILE_SIZE+TILE_SIZE/2+5, p.y*TILE_SIZE+TILE_SIZE/2+eyeOffset,3,0,Math.PI*2);
        ctx.fill();
      }
    });
  }

  function drawApple(){
    if(!apple)return;
    const cx=apple.x*TILE_SIZE+TILE_SIZE/2;
    const cy=apple.y*TILE_SIZE+TILE_SIZE/2;
    ctx.beginPath();ctx.arc(cx,cy,TILE_SIZE*0.4,0,Math.PI*2);
    ctx.fillStyle='#ff0000';ctx.fill();
    // leaf
    ctx.beginPath();ctx.moveTo(cx-5,cy-10);ctx.lineTo(cx+5,cy-10);ctx.lineTo(cx,cy-20);ctx.closePath();
    ctx.fillStyle='#00aa00';ctx.fill();
  }

  function draw(){
    ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
    drawCheckerboard();drawApple();drawSnake();
  }

  function update(){
    const newHead={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    // Wall collision
    if(newHead.x<0||newHead.x>=GRID_W||newHead.y<0||newHead.y>=GRID_H){gameOver();return;}
    // Self collision
    if(snake.some(p=>p.x===newHead.x&&p.y===newHead.y)){gameOver();return;}
    snake.unshift(newHead);
    if(apple && newHead.x===apple.x && newHead.y===apple.y){
      score++;scoreEl.textContent=score;playEat();
      spawnApple();
    }else{
      snake.pop();
    }
  }

  function gameLoop(){
    update();draw();
  }

  let interval=null;
  function startGame(){
    snake=[{x:7,y:7}];
    dir={x:0,y:-1};nextDir=null;score=0;scoreEl.textContent=0;
    spawnApple();
    if(interval)clearInterval(interval);
    interval=setInterval(gameLoop,200);
  }

  function gameOver(){
    clearInterval(interval);playOver();
    finalScoreEl.textContent='Final Score: '+score;
    overlay.style.visibility='visible';
  }

  document.addEventListener('keydown',e=>{
    const key=e.key.toLowerCase();
    let nd={x:0,y:0};
    if(['arrowup','w'].includes(key)){nd.y=-1;}
    else if(['arrowdown','s'].includes(key)){nd.y=1;}
    else if(['arrowleft','a'].includes(key)){nd.x=-1;}
    else if(['arrowright','d'].includes(key)){nd.x=1;}
    if(nd.x!==0||nd.y!==0){
      // Prevent reversing
      if(dir.x+nd.x===0&&dir.y+nd.y===0)return;
      nextDir={x:nd.x,y:nd.y};
    }
  });

  document.addEventListener('keyup',e=>{
    if(nextDir){dir=nextDir;nextDir=null;}
  });

  playAgainBtn.onclick=startGame;
  muteBtn.onclick=()=>{muted=!muted;gainNode.gain.value=muted?0:1;muteBtn.textContent=muted?'🔈':'🔇';};
  document.getElementById('restartBtn').onclick=startGame;

  // Persist high score
  const checkHigh = () => {if(score>highScore){highScore=score;localStorage.setItem('googleSnakeHigh',highScore);highScoreEl.textContent=highScore;}};

  setInterval(()=>{checkHigh();},1000);
  startGame();
})();
</script>
</body>
</html>
