<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f1f8e9;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            flex-direction: column;
            user-select: none;
        }

        .game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #c8e6c9;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
            pointer-events: none;
            opacity: 0;
        }

        .ui-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .score-display {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 24px;
            font-weight: 700;
            color: #2e7d32;
            z-index: 10;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        h1 {
            font-size: 36px;
            color: #2e7d32;
            margin: 0 0 10px 0;
        }

        p {
            font-size: 18px;
            color: #555;
            margin: 5px 0;
        }

        button {
            margin-top: 20px;
            padding: 12px 32px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background-color: #43a047;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(67, 160, 71, 0.3);
        }

        button:hover {
            background-color: #388e3c;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }
        
        .instructions {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="score-display">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- Start Screen -->
        <div id="startScreen" class="ui-overlay active">
            <h1>Snake</h1>
            <p>Eat the apples to grow!</p>
            <button id="startBtn">Play Game</button>
            <p class="instructions">Use Arrow Keys or WASD to move</p>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="ui-overlay">
            <h1>Game Over</h1>
            <p>Your score: <span id="finalScore">0</span></p>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const finalScoreDisplay = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Game Configuration
        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;
        const GAME_SPEED = 110; // Milliseconds per frame

        // Game State
        let snake = [];
        let food = {};
        let dx = 0; // Horizontal velocity
        let dy = 0; // Vertical velocity
        let pendingDx = 0;
        let pendingDy = 0;
        let score = 0;
        let gameRunning = false;
        let gameLoop = null;

        // Initialize Game
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            pendingDx = 1;
            pendingDy = 0;
            score = 0;
            scoreDisplay.textContent = score;
            generateFood();
        }

        function generateFood() {
            let newFood;
            let onSnake;
            do {
                onSnake = false;
                newFood = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
                // Ensure food doesn't spawn on the snake
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        onSnake = true;
                        break;
                    }
                }
            } while (onSnake);
            food = newFood;
        }

        function update() {
            // Apply pending direction to prevent 180-degree reversals in a single tick
            dx = pendingDx;
            dy = pendingDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check Wall Collisions
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                return gameOver();
            }

            // Check Self Collisions
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return gameOver();
                }
            }

            snake.unshift(head);

            // Check Food Collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.textContent = score;
                generateFood();
            } else {
                snake.pop(); // Remove tail if no food eaten
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#c8e6c9';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw subtle grid (optional, for that classic feel)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // Draw Food (Apple)
            ctx.fillStyle = '#e53935';
            ctx.beginPath();
            const foodCenterX = food.x * GRID_SIZE + GRID_SIZE / 2;
            const foodCenterY = food.y * GRID_SIZE + GRID_SIZE / 2;
            ctx.arc(foodCenterX, foodCenterY, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Apple stem
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(foodCenterX - 1, foodCenterY - GRID_SIZE / 2 + 2, 2, 4);

            // Draw Snake
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                const isHead = i === 0;
                
                // Gradient effect for snake body
                const alpha = 1 - (i / snake.length) * 0.4;
                ctx.fillStyle = isHead ? '#2e7d32' : `rgba(67, 160, 71, ${alpha})`;
                
                // Draw rounded rectangle for segments
                const padding = 1;
                const x = segment.x * GRID_SIZE + padding;
                const y = segment.y * GRID_SIZE + padding;
                const size = GRID_SIZE - padding * 2;
                const radius = isHead ? 6 : 4;
                
                drawRoundedRect(x, y, size, size, radius);
                ctx.fill();

                // Draw eyes on the head
                if (isHead) {
                    ctx.fillStyle = 'white';
                    let eyeOffsetX1, eyeOffsetY1, eyeOffsetX2, eyeOffsetY2;
                    const eyeSize = 3;

                    if (dx === 1) { // Right
                        eyeOffsetX1 = 12; eyeOffsetY1 = 5;
                        eyeOffsetX2 = 12; eyeOffsetY2 = 13;
                    } else if (dx === -1) { // Left
                        eyeOffsetX1 = 5; eyeOffsetY1 = 5;
                        eyeOffsetX2 = 5; eyeOffsetY2 = 13;
                    } else if (dy === 1) { // Down
                        eyeOffsetX1 = 5; eyeOffsetY1 = 12;
                        eyeOffsetX2 = 13; eyeOffsetY2 = 12;
                    } else { // Up
                        eyeOffsetX1 = 5; eyeOffsetY1 = 5;
                        eyeOffsetX2 = 13; eyeOffsetY2 = 5;
                    }

                    ctx.beginPath();
                    ctx.arc(x + eyeOffsetX1, y + eyeOffsetY1, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + eyeOffsetX2, y + eyeOffsetY2, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Pupils
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(x + eyeOffsetX1 + (dx * 1), y + eyeOffsetY1 + (dy * 1), 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + eyeOffsetX2 + (dx * 1), y + eyeOffsetY2 + (dy * 1), 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function drawRoundedRect(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            finalScoreDisplay.textContent = score;
            gameOverScreen.classList.add('active');
        }

        function startGame() {
            initGame();
            startScreen.classList.remove('active');
            gameOverScreen.classList.remove('active');
            gameRunning = true;
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                update();
                if (gameRunning) draw();
            }, GAME_SPEED);
            
            draw(); // Initial draw
        }

        // Input Handling
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy === 0) { pendingDx = 0; pendingDy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy === 0) { pendingDx = 0; pendingDy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx === 0) { pendingDx = -1; pendingDy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx === 0) { pendingDx = 1; pendingDy = 0; }
                    break;
            }
            
            // Prevent page scrolling with arrow keys
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });

        // Button Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Initial render so the canvas isn't blank behind the start screen
        initGame();
        draw();

    </script>
</body>
</html>
