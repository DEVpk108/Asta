<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Snake Clone</title>
    <style>
        :root {
            --bg-color: #bbada0;
            --snake-body: #4674e7;
            --wall-border: #578a34;
            --header-bg: #4a752c;
            --header-text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #faf8ef;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 480px;
            height: 570px; /* Fixed height to match grid */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #header {
            height: 45px;
            width: 100%;
            background-color: var(--header-bg);
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 10;
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--header-text);
            font-size: 14px;
        }

        .icon {
            width: 20px;
            height: 20px;
            fill: white;
        }

        #sound-toggle {
            cursor: pointer;
            opacity: 0.8;
        }
        #sound-toggle:hover { opacity: 1; }

        #game-over-overlay {
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            height: calc(100% - 45px);
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #game-over-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        button#restart-btn {
            background-color: #ffffff;
            color: var(--wall-border);
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        button#restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 8px rgba(0,0,0,0.3);
        }

        button#restart-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">
        <div class="stat-group">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C9 7 4 8 4 13c0 5 4 6 8 10 4-4 8-5 8-10 0-5-5-6-10-11zm0 4c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1z"/></svg>
            <span id="score-val">0</span>
        </div>
        
        <div class="stat-group" style="justify-content: center;">
             <svg class="icon" viewBox="0 0 24 24"><path d="M20.2 6.5c-.3-1-1.6-2.5-2.8-3.5C16.2 2 15 2 14.2 2H9.8C9 2 7.8 2 7 2.5 5.8 3.5 4.5 5 4.2 6.5c-.6 0-1 .4-1 1v9c0 1.7 1.3 3 3 3h8.6c1.7 0 3-1.3 3-3V7.5c0-.6-.4-1-1-1zm-5 8H9v1.5H7V9h2v1h1V9h1v4.5zM12 4c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1z"/></svg>
            <span id="highscore-val">0</span>
        </div>

        <div class="stat-group">
            <svg id="sound-toggle" viewBox="0 0 24 24" class="icon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <button id="restart-btn">Restart</button>
        </div>
    </div>

    <canvas id="gameCanvas" width="480" height="525"></canvas>

    <div id="game-over-overlay">
        <h1>Game Over</h1>
        <p>Score: <span id="final-score">0</span></p>
        <button id="restart-btn-overlay">Play Again</button>
    </div>
</div>

<script>
/**
 * Game State & Constants
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Configuration
const GRID_SIZE = 30;
const COLS = 16;
const ROWS = 17; // 15 game rows + header space handled by CSS/HTML
const GAME_SPEED = 120;

// Colors
const COLORS = {
    gridLight: '#a2d149',
    gridDark: '#aad751',
    border: '#578a34',
    snakeBody: '#4674e7',
    appleBody: '#ff4600',
    appleLeaf: '#aad751'
};

// Game Variables
let snake = [];
let apple = { x: 0, y: 0 };
let direction = 'RIGHT';
let nextDirection = 'RIGHT';
let score = 0;
let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
let isGameRunning = false;
let lastTime = 0;
let accumulator = 0;

// Audio Context - Initialize on first user interaction
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let soundEnabled = true;

// Input Queue for smooth movement
let inputQueue = [];

// UI Elements
const scoreEl = document.getElementById('score-val');
const highScoreEl = document.getElementById('highscore-val');
const finalScoreEl = document.getElementById('final-score');
const gameOverOverlay = document.getElementById('game-over-overlay');
const restartBtn = document.getElementById('restart-btn');
const restartBtnOverlay = document.getElementById('restart-btn-overlay');
const soundToggleIcon = document.getElementById('sound-toggle');

highScoreEl.textContent = highScore;

/**
 * Initialization & Loop
 */
function initGame() {
    // Start in the middle, moving right
    snake = [
        { x: 8, y: 12 },
        { x: 7, y: 12 },
        { x: 6, y: 12 }
    ];
    direction = 'RIGHT';
    nextDirection = 'RIGHT';
    inputQueue = []; // Clear any queued inputs
    score = 0;
    scoreEl.textContent = score;
    spawnApple();
    isGameRunning = true;
    gameOverOverlay.classList.remove('visible');
    lastTime = performance.now();
    accumulator = 0;
    requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp) {
    if (!isGameRunning) return;

    const deltaTime = timestamp - lastTime;
    accumulator += deltaTime;

    // Process input queue before update
    processInputQueue();

    if (accumulator >= GAME_SPEED) {
        update();
        accumulator = 0;
        render();
    } else {
        requestAnimationFrame(gameLoop);
    }
}

function processInputQueue() {
    while (inputQueue.length > 0 && inputQueue[0] !== null) {
        const move = inputQueue.shift();
        
        // Prevent 180-degree turns
        if (move === 'UP' && direction !== 'DOWN') {
            direction = 'UP';
        } else if (move === 'DOWN' && direction !== 'UP') {
            direction = 'DOWN';
        } else if (move === 'LEFT' && direction !== 'RIGHT') {
            direction = 'LEFT';
        } else if (move === 'RIGHT' && direction !== 'LEFT') {
            direction = 'RIGHT';
        }
    }
}

function update() {
    // Apply current direction
    const head = snake[0];
    let newHead = { ...head };

    if (direction === 'UP') newHead.y--;
    else if (direction === 'DOWN') newHead.y++;
    else if (direction === 'LEFT') newHead.x--;
    else if (direction === 'RIGHT') newHead.x++;

    // Wall Collision Check
    if (newHead.x < 0 || newHead.x >= COLS || newHead.y >= ROWS) {
        triggerGameOver();
        return;
    }

    // Self Collision Check - check all segments except the tail which will move
    for (let i = 0; i < snake.length - 1; i++) {
        if (newHead.x === snake[i].x && newHead.y === snake[i].y) {
            triggerGameOver();
            return;
        }
    }

    // Move Snake
    snake.unshift(newHead);

    // Food Collision Check
    if (newHead.x === apple.x && newHead.y === apple.y) {
        score++;
        scoreEl.textContent = score;
        playSound('eat');
        spawnApple();
    } else {
        snake.pop();
    }
}

/**
 * Rendering Logic
 */
function render() {
    // Draw Border
    ctx.strokeStyle = COLORS.border;
    ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, canvas.width, canvas.height);

    // Draw Checkerboard Grid
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            ctx.fillStyle = ((x + y) % 2 === 0) ? COLORS.gridLight : COLORS.gridDark;
            // Draw rects slightly smaller than GRID_SIZE to create the grid lines effect
            ctx.fillRect(x * GRID_SIZE, y * GRID_SIZE, GRID_SIZE - 1, GRID_SIZE - 1);
        }
    }

    // Draw Apple
    drawApple(apple.x, apple.y);

    // Draw Snake
    snake.forEach((seg, index) => {
        const isHead = index === 0;
        const x = seg.x * GRID_SIZE + GRID_SIZE/2;
        const y = seg.y * GRID_SIZE + GRID_SIZE/2;
        
        ctx.fillStyle = COLORS.snakeBody;
        
        if (isHead) {
            ctx.beginPath();
            ctx.arc(x, y, GRID_SIZE * 0.42, 0, Math.PI * 2);
            ctx.fill();
            drawEyes(x, y);
        } else {
            // Draw rounded body segments
            const padding = GRID_SIZE * 0.1;
            const size = GRID_SIZE - padding*2;
            
            ctx.beginPath();
            roundRect(ctx, x - (GRID_SIZE/2) + (size/2), y - (GRID_SIZE/2) + (size/2), size, size, 4);
            ctx.fill();
        }
    });
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawEyes(headX, headY) {
    const eyeOffset = GRID_SIZE * 0.25;
    const pupilSize = GRID_SIZE * 0.08;
    
    ctx.fillStyle = 'white';
    
    let leftEye = { x: headX - eyeOffset, y: headY };
    let rightEye = { x: headX + eyeOffset, y: headY };

    if (direction === 'UP') leftEye.y -= eyeOffset; rightEye.y -= eyeOffset;
    if (direction === 'DOWN') leftEye.y += eyeOffset; rightEye.y += eyeOffset;

    ctx.beginPath();
    ctx.arc(leftEye.x, leftEye.y, eyeOffset, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(rightEye.x, rightEye.y, eyeOffset, 0, Math.PI*2);
    ctx.fill();

    const pOffset = direction === 'LEFT' ? -eyeOffset : (direction === 'RIGHT' ? eyeOffset : 0);
    
    ctx.fillStyle = 'black';
    
    let pLeftX = leftEye.x + (direction === 'LEFT' ? -eyeOffset : 2);
    let pRightX = rightEye.x + (direction === 'RIGHT' ? eyeOffset : -2);

    ctx.beginPath();
    ctx.arc(pLeftX, leftEye.y, pupilSize, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(pRightX, rightEye.y, pupilSize, 0, Math.PI*2);
    ctx.fill();
}

function drawApple(x, y) {
    const cx = x * GRID_SIZE + GRID_SIZE/2;
    const cy = y * GRID_SIZE + GRID_SIZE/2;
    const r = GRID_SIZE * 0.35;

    ctx.fillStyle = COLORS.appleBody;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = COLORS.appleLeaf;
    ctx.beginPath();
    ctx.ellipse(cx, cy - r + 2, 4, 8, Math.PI/4, 0, Math.PI*2); 
    ctx.fill();
}

function spawnApple() {
    let valid = false;
    while (!valid) {
        const x = Math.floor(Math.random() * COLS);
        const y = Math.floor(Math.random() * (ROWS - 1));
        
        let occupied = false;
        for(let seg of snake) {
            if(seg.x === x && seg.y === y) occupied = true;
        }

        if (!occupied) {
            apple = { x, y };
            valid = true;
        }
    }
}

function triggerGameOver() {
    isGameRunning = false;
    
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', highScore);
        highScoreEl.textContent = highScore;
    }

    finalScoreEl.textContent = score;
    playSound('gameOver');
    
    setTimeout(() => {
        gameOverOverlay.classList.add('visible');
    }, 100);
}

/**
 * Input Handling - FIXED VERSION with proper queueing
 */
window.addEventListener('keydown', e => {
    if (!isGameRunning && gameOverOverlay.classList.contains('visible')) return;
    
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
        e.preventDefault();
    }

    switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
            // Add to queue, don't apply immediately
            inputQueue.push('UP');
            break;
        case 'ArrowDown':
        case 's':
        case 'S':
            inputQueue.push('DOWN');
            break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
            inputQueue.push('LEFT');
            break;
        case 'ArrowRight':
        case 'd':
        case 'D':
            inputQueue.push('RIGHT');
            break;
    }
});

/**
 * Audio Synthesis - FIXED VERSION with proper context handling
 */
function playSound(type) {
    if (!soundEnabled) return;
    
    // Resume context if suspended (browser policy)
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    if (type === 'eat') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'gameOver') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1.5);
        
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);

        osc.start();
        osc.stop(audioCtx.currentTime + 2.0);
    }
}

/**
 * UI Interactions - FIXED VERSION
 */
restartBtn.addEventListener('click', () => {
    initGame();
});

restartBtnOverlay.addEventListener('click', () => {
    initGame();
});

soundToggleIcon.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
});

// Initial Start - FIXED: Ensure audio context is ready on first interaction
document.body.addEventListener('click', () => {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}, { once: true });

initGame();

</script>
</body>
</html>
