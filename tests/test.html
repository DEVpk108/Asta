<!DOCTYPE html>
<html>
<head>
    <title>Google Snake</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f8ff; /* Light blue background */
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 400px;
            max-width: 90%; /* Responsive width */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: #4a752c;
            color: white;
            padding: 10px;
            width: 100%;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score {
            font-size: 16px;
        }

        .high-score {
            font-size: 12px;
        }

        #canvas {
            border: solid #578a34 5px;
            background-color: #a2d149; /* Light green */
        }

        footer {
            margin-top: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 24px;
            text-align: center;
        }

        .game-over button {
            padding: 10px 20px;
            background-color: #578a34;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div></div>
            <div class="score">🍎 Score: <span id="score">0</span></div>
            <div class="high-score">🏆 High Score: <span id="highScore">0</span></div>
            <div style="display: flex; align-items: center;">
                <button onclick="toggleSound()">🔈</button>
                <button onclick="restartGame()">Restart</button>
            </div>
        </header>

        <canvas id="canvas" width="400" height="400"></canvas>

        <footer></footer>
    </div>

    <div class="game-over" id="gameOver">
        <h1>Game Over</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');

        const gridSize = 15; // Adjust grid size as needed
        const tileSize = canvas.width / gridSize;
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let snake = [];
        let food = {};
        let direction = 'right';
        let lastDirection = null;
        let gameRunning = false;
        let soundEnabled = true;

        // Initialize Snake and Food
        function initGame() {
            snake = [{ x: Math.floor(gridSize / 2), y: Math.floor(gridSize / 2) }];
            food = { x: Math.floor(Math.random() * gridSize), y: Math.floor(Math.random() * gridSize) };
            score = 0;
            highScore = localStorage.getItem('highScore') || 0;
            direction = 'right';
            gameRunning = true;

            updateCanvas();
        }


        // Update Canvas (Drawing)
        function updateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Grid
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    ctx.fillStyle = i % 2 === 0 ? '#a2d149' : '#aad751'; // Checkerboard pattern
                    ctx.fillRect(j * tileSize, i * tileSize, tileSize, tileSize);
                }
            }

            // Draw Snake
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                ctx.fillStyle = '#4674e7'; // Blue
                ctx.beginPath();
                ctx.arc(segment.x * tileSize + tileSize / 2, segment.y * tileSize + tileSize / 2, tileSize / 2 - 2, 0, 2 * Math.PI);
                ctx.fill();

                // Draw Eyes (Head Only)
                if (i === 0) { // Head Segment
                    const eyeSize = tileSize / 6;
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(segment.x * tileSize + tileSize / 2 - eyeSize / 2, segment.y * tileSize + tileSize / 2 - eyeSize / 2, eyeSize, 0, 2 * Math.PI);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(segment.x * tileSize + tileSize / 2 + eyeSize / 2, segment.y * tileSize + tileSize / 2 - eyeSize / 2, eyeSize, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }

            // Draw Food
            ctx.fillStyle = 'red'; // Red
            ctx.beginPath();
            ctx.arc(food.x * tileSize + tileSize / 2, food.y * tileSize + tileSize / 2, tileSize / 2 - 2, 0, 2 * Math.PI);
            ctx.fill();

            // Draw Leaf on Food
            ctx.fillStyle = 'green';
            ctx.beginPath();
            ctx.moveTo(food.x * tileSize + tileSize / 2, food.y * tileSize + tileSize / 2 - tileSize / 8);
            ctx.lineTo(food.x * tileSize + tileSize / 2 - tileSize / 16, food.y * tileSize + tileSize / 2 - tileSize / 8);
            ctx.lineTo(food.x * tileSize + tileSize / 2 + tileSize / 16, food.y * tileSize + tileSize / 2 - tileSize / 8);
            ctx.closePath();
            ctx.fill();

            updateScoreDisplay();
        }


        // Update Score Display
        function updateScoreDisplay() {
            scoreEl.textContent = score;
            highScoreEl.textContent = highScore;
        }

        // Game Logic - Movement and Collisions
        function moveSnake() {
            const head = snake[0];
            const newHead = { x: head.x + direction === 'right' ? 1 : (direction === 'left' ? -1 : 0), y: head.y + (direction === 'down' ? 1 : (direction === 'up' ? -1 : 0)) };

            // Prevent rapid double-keypress bugs
            if (lastDirection && direction === lastDirection) {
                return; // Ignore the input if it's the same as the previous one
            }

            // Check for collisions with walls
            if (newHead.x < 0 || newHead.x >= gridSize || newHead.y < 0 || newHead.y >= gridSize) {
                gameOver();
                return;
            }

            // Check for self-collision
            for (let i = 1; i < snake.length; i++) {
                if (newHead.x === snake[i].x && newHead.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            // Add the new head to the snake
            snake.unshift(newHead);

            // Check if we ate food
            if (newHead.x === food.x && newHead.y === food.y) {
                score++;
                updateScoreDisplay();
                playEatSound();
                spawnFood();
            } else {
                // Remove the tail segment
                snake.pop();
            }

            lastDirection = direction; // Update lastDirection for input buffering
        }


        // Spawn Food
        function spawnFood() {
            let newFood;
            do {
                newFood = { x: Math.floor(Math.random() * gridSize), y: Math.floor(Math.random() * gridSize) };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y)); // Ensure food doesn't spawn on snake

            food = newFood;
        }


        // Game Over Handling
        function gameOver() {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
                highScoreEl.textContent = highScore;
            }

            gameRunning = false;
            finalScoreEl.textContent = score;
            gameOverEl.style.display = 'flex';
            playGameOverSound();
        }


        // Sound Effects (Web Audio API)
        function playEatSound() {
            if (!soundEnabled) return;

            const audioContext = new AudioContext();
            const oscillator = audioContext.createOscillator(type = 'sine', detune = 0, gain = 1);
            oscillator.frequency.setValueAtTime(440, audioContext.currentTime); // A4 note
            oscillator.connect(audioContext.destination);
            oscillator.start();

            setTimeout(() => { oscillator.stop(); }, 200);
        }

        function playGameOverSound() {
            if (!soundEnabled) return;

            const audioContext = new AudioContext();
            const oscillator = audioContext.createOscillator(type = 'sine', detune = 0, gain = 1);
            oscillator.frequency.setValueAtTime(220, audioContext.currentTime); // Lower frequency for game over
            oscillator.connect(audioContext.destination);
            oscillator.start();

            setTimeout(() => { oscillator.stop(); }, 500);
        }


        // Input Handling
        document.addEventListener('keydown', (event) => {
            let newDirection;
            switch (event.key) {
                case 'ArrowRight':
                case 'd':
                    newDirection = 'right';
                    break;
                case 'ArrowLeft':
                case 'a':
                    newDirection = 'left';
                    break;
                case 'ArrowDown':
                case 's':
                    newDirection = 'down';
                    break;
                case 'ArrowUp':
                case 'w':
                    newDirection = 'up';
                    break;
                default:
                    return; // Ignore other keys
            }

            if (gameRunning && newDirection !== lastDirection) {
                direction = newDirection;
            }
        });


        // Restart Game
        function restartGame() {
            gameRunning = false;
            gameOverEl.style.display = 'none';
            initGame();
        }

        // Toggle Sound
        function toggleSound() {
            soundEnabled = !soundEnabled;
        }

        // Main Game Loop
        function gameLoop() {
            if (gameRunning) {
                moveSnake();
                updateCanvas();
            }
            requestAnimationFrame(gameLoop);
        }


        initGame();
        gameLoop();
    </script>
</body>
</html>
