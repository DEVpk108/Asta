[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asta-local-assistant"
version = "0.1.0"
description = "Local-first voice assistant developer workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sounddevice", "numpy", "openwakeword", "onnxruntime", "silero-vad", "torch",
  "faster-whisper", "sherpa-onnx>=1.13", "requests", "pyautogui", "pyperclip",
]

[project.optional-dependencies]
kokoro = ["torch>=2.5,<3", "kokoro", "soundfile", "misaki[en]"]
browser = ["playwright>=1.40,<2"]
laya = ["laya>=0.3.5,<0.4"]
mempalace = ["mempalace==3.10.0"]
indic = ["transformers", "torchaudio", "onnx", "onnxruntime"]
wakeword-training = ["scipy", "soundfile", "tqdm", "pydub", "PyYAML"]
dev = ["pytest>=7", "tomli; python_version < '3.11'"]

[tool.setuptools]
py-modules = ["main"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "chat_history*", "core*", "hud*", "memory*", "speech*", "voice*", "vision*"]
exclude = ["ai.wakeword.openWakeWord*", "ai.wakeword.dataset*", "ai.wakeword.generated*", "hud.node_modules*", "tests*", "experiments*"]
namespaces = true
